[project]
name = "aidmesh"
version = "1.0.0"
description = "A LangChain + CrewAI + Groq crew that turns raw multilingual crisis reports into a verified, prioritised response plan."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E701", "E702", "UP006", "UP035", "SIM108"]
